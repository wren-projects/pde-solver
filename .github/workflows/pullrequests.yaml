name: CI Pipeline

on:
  pull_request:
    branches: ["**"]

jobs:
  check_lint:
    name: Lint the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - run: just lint

  run_test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - run: just test 

  check_types:
    name: Check typing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - run: just typecheck

  run_coverage:
    name: Check coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - run: |
          uv run pytest --cov=src --cov=packages \
              --cov-fail-under=${{ vars.MINIMAL_TEST_COVERAGE }}

  check_pdes_is_build:
    name: Ensure pde.py were not manually altered
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env

      - name: Backup original
        run: cp -a packages/ backup/

      - name: Run just
        run: just generate-pdes

      - name: Check diff
        run: diff -ruN -X .gitignore packages/ backup/
