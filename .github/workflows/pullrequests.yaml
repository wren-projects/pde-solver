name: CI Pipeline

on:
  pull_request:
    branches: ["**"]

jobs:
  check_lint:
    name: Lint the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - run: just lint

  check_types:
    name: Check typing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - run: just typecheck

  run_coverage:
    name: Check coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env
      - name: Run tests and check coverage
        run: |
          uv run pytest --cov=src --cov=packages \
              --cov-fail-under=${{ vars.MINIMAL_TEST_COVERAGE }}

  check_pdes_is_build:
    name: Ensure pde.py were not manually altered
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env

      - run: just generate-pdes

      - name: Check for changes
        run: git diff --exit-code packages/
